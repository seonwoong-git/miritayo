@Composable
private fun MiritayoApp() {

    val context = LocalContext.current

    var screen by remember {
        mutableStateOf(Screen.HOME)
    }

    var incident by remember {
        mutableStateOf(Incident.PASSED)
    }

    var incidentStart by remember {
        mutableLongStateOf(0L)
    }

    var logs by remember {
        mutableStateOf(loadLogs(context))
    }

    var guardianPending by remember {
        mutableStateOf<Incident?>(null)
    }

    var gpsText by remember {
        mutableStateOf("GPS 확인 전")
    }

    var settings by remember {
        mutableStateOf(loadSettings(context))
    }

    val tts = rememberTts(context)

    fun speak(text: String) {
        if (settings.tts) {
            tts?.speak(
                text,
                TextToSpeech.QUEUE_FLUSH,
                null,
                "miritayo"
            )
        }
    }

    fun vibrationAlert() {

        if (!settings.vibrate) {
            return
        }

        val vibrator: Vibrator =
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {

                val vibratorManager =
                    context.getSystemService(
                        Context.VIBRATOR_MANAGER_SERVICE
                    ) as VibratorManager

                vibratorManager.defaultVibrator

            } else {

                @Suppress("DEPRECATION")
                context.getSystemService(
                    Context.VIBRATOR_SERVICE
                ) as Vibrator
            }

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

            vibrator.vibrate(
                VibrationEffect.createOneShot(
                    220,
                    VibrationEffect.DEFAULT_AMPLITUDE
                )
            )

        } else {

            @Suppress("DEPRECATION")
            vibrator.vibrate(220)
        }
    }

    MaterialTheme(
        colorScheme = lightColorScheme(
            primary = Blue,
            secondary = Mint,
            background = Color(0xFFF7FAFF),
            surface = Color.White,
            onSurface = Navy
        )
    ) {

        Surface(
            modifier = Modifier.fillMaxSize(),
            color = Color(0xFFF7FAFF)
        ) {

            when (screen) {

                Screen.HOME -> {

                    HomeScreen(
                        recommended = recommend(logs),
                        onScreen = {
                            screen = it
                        }
                    )
                }

                Screen.REHEARSAL -> {

                    RehearsalScreen(
                        recommended = recommend(logs),
                        onHome = {
                            screen = Screen.HOME
                        }
                    )
                }

                Screen.LIVE -> {

                    LiveScreen(
                        gpsText = gpsText,

                        onGps = {
                            gpsText = it
                        },

                        onIncident = { selectedIncident ->

                            incident = selectedIncident

                            incidentStart =
                                System.currentTimeMillis()

                            vibrationAlert()

                            speak(
                                selectedIncident.message +
                                    " " +
                                    selectedIncident.hint
                            )

                            screen = Screen.INCIDENT
                        },

                        onHome = {
                            screen = Screen.HOME
                        }
                    )
                }

                Screen.INCIDENT -> {

                    IncidentScreen(
                        incident = incident,

                        onSuccess = {

                            val seconds =
                                (
                                    (
                                        System.currentTimeMillis() -
                                            incidentStart
                                        ) / 1000
                                    )
                                    .toInt()
                                    .coerceAtLeast(1)

                            logs =
                                logs + Log(
                                    type = incident,
                                    help = false,
                                    seconds = seconds,
                                    at = System.currentTimeMillis()
                                )

                            saveLogs(
                                context = context,
                                logs = logs
                            )

                            screen = Screen.COMPLETE
                        },

                        onHelp = {

                            guardianPending = incident

                            screen = Screen.GUARDIAN
                        }
                    )
                }

                Screen.GUARDIAN -> {

                    GuardianScreen(
                        pending = guardianPending,

                        onAck = {

                            val seconds =
                                (
                                    (
                                        System.currentTimeMillis() -
                                            incidentStart
                                        ) / 1000
                                    )
                                    .toInt()
                                    .coerceAtLeast(1)

                            logs =
                                logs + Log(
                                    type = incident,
                                    help = true,
                                    seconds = seconds,
                                    at = System.currentTimeMillis()
                                )

                            saveLogs(
                                context = context,
                                logs = logs
                            )

                            guardianPending = null

                            screen = Screen.COMPLETE
                        },

                        onHome = {
                            screen = Screen.HOME
                        }
                    )
                }

                Screen.COMPLETE -> {

                    CompleteScreen(
                        incident = incident,
                        lastLog = logs.lastOrNull(),

                        onRecords = {
                            screen = Screen.RECORDS
                        },

                        onHome = {
                            screen = Screen.HOME
                        }
                    )
                }

                Screen.RECORDS -> {

                    RecordsScreen(
                        logs = logs,

                        onPractice = {
                            screen = Screen.REHEARSAL
                        },

                        onClear = {

                            logs = emptyList()

                            saveLogs(
                                context = context,
                                logs = logs
                            )
                        },

                        onHome = {
                            screen = Screen.HOME
                        }
                    )
                }

                Screen.SETTINGS -> {

                    SettingsScreen(
                        settings = settings,

                        onChange = {

                            settings = it

                            saveSettings(
                                context = context,
                                settings = it
                            )
                        },

                        onSpeak = {

                            speak(
                                "미리타요 접근성 설정 화면입니다."
                            )
                        },

                        onHome = {
                            screen = Screen.HOME
                        }
                    )
                }
            }
        }
    }
}

@Composable
private fun rememberTts(
    context: Context
): TextToSpeech? {

    var tts by remember {
        mutableStateOf<TextToSpeech?>(null)
    }

    DisposableEffect(context) {

        val engine =
            TextToSpeech(context) { status ->

                if (
                    status ==
                    TextToSpeech.SUCCESS
                ) {

                    tts?.language =
                        Locale.KOREAN
                }
            }

        tts = engine

        onDispose {

            engine.stop()
            engine.shutdown()
        }
    }

    return tts
}

