private fun recommend(
    logs: List<Log>
): Incident? {

    if (
        logs.isEmpty()
    ) {

        return null
    }

    return Incident
        .entries
        .maxByOrNull {

            incident ->

            logs
                .filter {

                    it.type ==
                        incident
                }
                .sumOf {

                    log ->

                    (
                        if (
                            log.help
                        ) {
                            300
                        } else {
                            100
                        }
                        ) +
                        log.seconds
                            .coerceAtMost(
                                60
                            )
                }
        }
}

private fun saveLogs(
    context: Context,
    logs: List<Log>
) {

    val array =
        JSONArray()

    logs
        .takeLast(50)
        .forEach {

            log ->

            array.put(
                JSONObject()
                    .put(
                        "type",
                        log.type.name
                    )
                    .put(
                        "help",
                        log.help
                    )
                    .put(
                        "seconds",
                        log.seconds
                    )
                    .put(
                        "at",
                        log.at
                    )
            )
        }

    context
        .getSharedPreferences(
            "miritayo",
            Context.MODE_PRIVATE
        )
        .edit()
        .putString(
            "logs",
            array.toString()
        )
        .apply()
}

private fun loadLogs(
    context: Context
): List<Log> {

    return runCatching {

        val json =
            context
                .getSharedPreferences(
                    "miritayo",
                    Context.MODE_PRIVATE
                )
                .getString(
                    "logs",
                    "[]"
                )
                ?: "[]"

        val array =
            JSONArray(json)

        (0 until array.length())
            .map {

                index ->

                val obj =
                    array
                        .getJSONObject(
                            index
                        )

                Log(
                    type =
                        Incident.valueOf(
                            obj.getString(
                                "type"
                            )
                        ),

                    help =
                        obj.getBoolean(
                            "help"
                        ),

                    seconds =
                        obj.getInt(
                            "seconds"
                        ),

                    at =
                        obj.getLong(
                            "at"
                        )
                )
            }

    }.getOrDefault(
        emptyList()
    )
}

private fun saveSettings(
    context: Context,
    settings: AppSettings
) {

    context
        .getSharedPreferences(
            "miritayo",
            Context.MODE_PRIVATE
        )
        .edit()
        .putBoolean(
            "tts",
            settings.tts
        )
        .putBoolean(
            "vib",
            settings.vibrate
        )
        .putBoolean(
            "large",
            settings.largeText
        )
        .apply()
}

private fun loadSettings(
    context: Context
): AppSettings {

    val preferences =
        context
            .getSharedPreferences(
                "miritayo",
                Context.MODE_PRIVATE
            )

    return AppSettings(
        tts =
            preferences
                .getBoolean(
                    "tts",
                    true
                ),

        vibrate =
            preferences
                .getBoolean(
                    "vib",
                    true
                ),

        largeText =
            preferences
                .getBoolean(
                    "large",
                    false
                )
    )
}
