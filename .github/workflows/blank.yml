@Composable
private fun RehearsalScreen(
    recommended: Incident?,
    onHome: () -> Unit
) {

    var step by remember {
        mutableIntStateOf(0)
    }

    val target =
        recommended
            ?: Incident.PASSED

    val titles =
        listOf(
            "정류장을 확인해요.",
            "102번 버스 번호를 확인해요.",
            target.message
        )

    val hints =
        listOf(
            "중앙도서관 정류장",
            "교통카드를 찍고 자리에 앉아요.",
            target.hint
        )

    Page(
        title = "사전 리허설",

        subtitle =
            "실전에서 볼 문장과 같은 표현을 사용합니다."
    ) {

        Row(
            modifier =
                Modifier.fillMaxWidth(),

            horizontalArrangement =
                Arrangement.Center
        ) {

            repeat(3) {

                Box(
                    modifier =
                        Modifier
                            .padding(4.dp)
                            .size(
                                if (
                                    it == step
                                ) {
                                    18.dp
                                } else {
                                    11.dp
                                }
                            )
                            .background(
                                color =
                                    if (
                                        it == step
                                    ) {
                                        Blue
                                    } else {
                                        Color.LightGray
                                    },

                                shape =
                                    RoundedCornerShape(
                                        50
                                    )
                            )
                )
            }
        }

        Surface(
            modifier =
                Modifier.fillMaxWidth(),

            shape =
                RoundedCornerShape(26.dp),

            color =
                if (step == 2) {
                    SoftRed
                } else {
                    SoftBlue
                }
        ) {

            Column(
                modifier =
                    Modifier.padding(26.dp),

                horizontalAlignment =
                    Alignment.CenterHorizontally,

                verticalArrangement =
                    Arrangement.spacedBy(14.dp)
            ) {

                Text(
                    text =
                        when (step) {

                            0 -> "🚏"

                            1 -> "🚌"

                            else ->
                                target.icon
                        },

                    fontSize = 54.sp
                )

                Text(
                    text =
                        titles[step],

                    fontSize = 24.sp,

                    fontWeight =
                        FontWeight.ExtraBold,

                    textAlign =
                        TextAlign.Center
                )

                Surface(
                    shape =
                        RoundedCornerShape(
                            16.dp
                        ),

                    color =
                        Color.White
                ) {

                    Text(
                        text =
                            hints[step],

                        modifier =
                            Modifier.padding(
                                15.dp
                            ),

                        fontSize =
                            19.sp,

                        fontWeight =
                            FontWeight.Bold,

                        textAlign =
                            TextAlign.Center,

                        color =
                            if (
                                step == 2
                            ) {
                                Red
                            } else {
                                Blue
                            }
                    )
                }
            }
        }

        Row(
            horizontalArrangement =
                Arrangement.spacedBy(
                    10.dp
                )
        ) {

            OutlinedButton(
                onClick = {

                    if (step > 0) {

                        step--

                    } else {

                        onHome()
                    }
                },

                modifier =
                    Modifier
                        .weight(1f)
                        .height(56.dp)
            ) {

                Text("이전")
            }

            Button(
                onClick = {

                    if (step < 2) {

                        step++

                    } else {

                        onHome()
                    }
                },

                modifier =
                    Modifier
                        .weight(1f)
                        .height(56.dp)
            ) {

                Text(
                    if (step == 2) {
                        "연습 완료"
                    } else {
                        "다음"
                    }
                )
            }
        }
    }
}

@Composable
private fun LiveScreen(
    gpsText: String,
    onGps: (String) -> Unit,
    onIncident: (Incident) -> Unit,
    onHome: () -> Unit
) {

    val context =
        LocalContext.current

    val permissionLauncher =
        rememberLauncherForActivityResult(
            contract =
                ActivityResultContracts
                    .RequestMultiplePermissions()
        ) { grants ->

            if (
                grants.values.any {
                    it
                }
            ) {

                requestLocation(
                    context = context,
                    onGps = onGps
                )

            } else {

                onGps(
                    "위치 권한이 없어 GPS를 읽지 못했습니다."
                )
            }
        }

    Page(
        title =
            "실전 이동",

        subtitle =
            "실제 GPS 읽기와 시연용 돌발상황 트리거를 분리했습니다."
    ) {

        InfoCard(
            title =
                "현재 이동",

            color =
                SoftMint
        ) {

            Text(
                text =
                    "102번 버스 · 도서관 방향",

                fontSize =
                    21.sp,

                fontWeight =
                    FontWeight.Bold
            )

            Text(
                text =
                    "다음 행동: 중앙도서관 정류장에서 내려요.",

                fontSize =
                    17.sp
            )
        }

        InfoCard(
            title = "GPS",
            color = SoftBlue
        ) {

            Text(
                text = gpsText,
                fontSize = 15.sp
            )

            OutlinedButton(
                onClick = {

                    val fineGranted =
                        ContextCompat
                            .checkSelfPermission(
                                context,
                                Manifest
                                    .permission
                                    .ACCESS_FINE_LOCATION
                            ) ==
                            PackageManager
                                .PERMISSION_GRANTED

                    val coarseGranted =
                        ContextCompat
                            .checkSelfPermission(
                                context,
                                Manifest
                                    .permission
                                    .ACCESS_COARSE_LOCATION
                            ) ==
                            PackageManager
                                .PERMISSION_GRANTED

                    if (
                        fineGranted ||
                        coarseGranted
                    ) {

                        requestLocation(
                            context = context,
                            onGps = onGps
                        )

                    } else {

                        permissionLauncher.launch(
                            arrayOf(
                                Manifest
                                    .permission
                                    .ACCESS_FINE_LOCATION,

                                Manifest
                                    .permission
                                    .ACCESS_COARSE_LOCATION
                            )
                        )
                    }
                },

                modifier =
                    Modifier.fillMaxWidth()
            ) {

                Text(
                    "실제 GPS 읽기"
                )
            }
        }

        Text(
            text =
                "돌발상황 3종 시연",

            fontWeight =
                FontWeight.Bold,

            fontSize =
                19.sp
        )

        Incident.entries.forEach {
            incident ->

            OutlinedButton(
                onClick = {

                    onIncident(
                        incident
                    )
                },

                modifier =
                    Modifier
                        .fillMaxWidth()
                        .height(60.dp),

                shape =
                    RoundedCornerShape(
                        18.dp
                    )
            ) {

                Text(
                    text =
                        "${incident.icon} ${incident.label}",

                    fontWeight =
                        FontWeight.Bold
                )
            }
        }

        Text(
            text =
                "※ 자동 감지는 아직 데모이며, 실제 앱에서는 GPS·정류장 순서·버스 API를 연결할 예정입니다.",

            fontSize =
                13.sp,

            color =
                Color.Gray
        )

        TextButton(
            onClick = onHome,

            modifier =
                Modifier.align(
                    Alignment.CenterHorizontally
                )
        ) {

            Text("홈으로")
        }
    }
}

private fun requestLocation(
    context: Context,
    onGps: (String) -> Unit
) {

    val locationManager =
        context.getSystemService(
            Context.LOCATION_SERVICE
        ) as LocationManager

    val providers =
        listOf(
            LocationManager.GPS_PROVIDER,
            LocationManager.NETWORK_PROVIDER
        )

    try {

        val lastKnownLocation =
            providers
                .mapNotNull {
                    provider ->

                    runCatching {

                        locationManager
                            .getLastKnownLocation(
                                provider
                            )

                    }.getOrNull()
                }
                .maxByOrNull {
                    it.time
                }

        if (
            lastKnownLocation != null
        ) {

            onGps(
                "실제 위치: %.5f, %.5f · 오차 약 %.0fm"
                    .format(
                        lastKnownLocation.latitude,
                        lastKnownLocation.longitude,
                        lastKnownLocation.accuracy
                    )
            )

            return
        }

        val listener =
            object :
                LocationListener {

                override fun onLocationChanged(
                    location: Location
                ) {

                    onGps(
                        "실제 위치: %.5f, %.5f · 오차 약 %.0fm"
                            .format(
                                location.latitude,
                                location.longitude,
                                location.accuracy
                            )
                    )

                    locationManager
                        .removeUpdates(
                            this
                        )
                }
            }

        locationManager
            .requestLocationUpdates(
                LocationManager
                    .NETWORK_PROVIDER,

                0L,
                0f,
                listener,
                Looper.getMainLooper()
            )

        onGps(
            "GPS 위치를 확인 중입니다."
        )

    } catch (
        exception: SecurityException
    ) {

        onGps(
            "위치 권한을 확인해 주세요."
        )
    }
}

